name: Repository Flattener

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Dateien mit Python zusammenführen
        run: |
          python3 -c '
          import os

          output_file = "repository_flattened.txt"
          
          # Ordner, die komplett ignoriert werden sollen
          ignored_dirs = {
              ".git", ".github", "node_modules", "venv", ".venv", 
              ".idea", ".vscode", "__pycache__", ".cptr", 
              ".svelte-kit", "dist", "build", "target"
          }
          
          # Dateinamen, die ignoriert werden
          ignored_files = {"uv.lock", output_file}
          
          # Dateiendungen, die ignoriert werden (Binärdateien, Archive etc.)
          ignored_exts = {
              ".png", ".jpg", ".jpeg", ".gif", ".zip", ".tar", 
              ".gz", ".pdf", ".ico", ".exe", ".lock", ".pyc", ".whl"
          }

          with open(output_file, "w", encoding="utf-8", errors="ignore") as out:
              out.write("================================================================\n")
              out.write("Repository Inhalt (Vollständig inkl. Unterordner)\n")
              out.write("================================================================\n\n")

              for root, dirs, files in os.walk("."):
                  # Ignorierte Ordner aus der Suche ausschließen
                  dirs[:] = [d for d in dirs if d not in ignored_dirs and not d.startswith(".")]

                  for file in files:
                      if file in ignored_files or any(file.endswith(ext) for ext in ignored_exts):
                          continue
                      
                      file_path = os.path.join(root, file)
                      rel_path = os.path.relpath(file_path, ".")

                      out.write("================================================================\n")
                      out.write(f"File: {rel_path}\n")
                      out.write("================================================================\n")
                      out.write("```\n")

                      try:
                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              out.write(f.read())
                      except Exception as e:
                          out.write(f"[Fehler beim Lesen: {e}]\n")

                      out.write("\n```\n\n")
          '

      - name: Datei als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: repo-flattened-txt
          path: repository_flattened.txt
